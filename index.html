<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>노미요의 숲</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0c14; }
      canvas { display: block; }
      /* 우상단 모드/날짜 배지: 사용자 요청으로 표시하지 않는다 (main.js 의 상태 갱신은 그대로) */
      #mode, #day { display: none !important; }
      #mode { z-index: 10; position: fixed; right: 16px; top: 16px; padding: 8px 14px; border-radius: 999px;
        color: #ffb070; font: 600 13px system-ui, sans-serif; letter-spacing: 0.04em;
        background: rgba(10, 12, 20, 0.72); border: 1px solid rgba(255,176,112,0.4); }
      #mode.horror { color: #ff5c5c; border-color: rgba(255,92,92,0.5); }
      #day { z-index: 10; position: fixed; right: 16px; top: 58px; padding: 5px 12px; border-radius: 999px;
        color: #e8e6df; font: 600 12px system-ui, sans-serif; letter-spacing: 0.06em;
        background: rgba(10, 12, 20, 0.6); border: 1px solid rgba(255,255,255,0.14); }
      #scareFlash { z-index: 15; position: fixed; inset: 0; pointer-events: none; opacity: 0;
        background: radial-gradient(ellipse at center, rgba(120,0,10,0.15) 0%, rgba(120,0,10,0.75) 100%); }
      #scareFlash.on { animation: scareFlash 0.8s ease-out forwards; }
      @keyframes scareFlash { 0% { opacity: 1; } 15% { opacity: 0.4; } 30% { opacity: 1; } 100% { opacity: 0; } }
      #prompt {
        position: fixed; left: 0; top: 0; padding: 6px 12px 6px 8px; border-radius: 999px;
        display: flex; align-items: center; gap: 8px; white-space: nowrap;
        color: #fff; font: 600 13px system-ui, "Malgun Gothic", sans-serif;
        background: rgba(10, 12, 20, 0.78); border: 1px solid rgba(255,176,112,0.5);
        box-shadow: 0 0 12px rgba(255,176,112,0.25);
        opacity: 0; pointer-events: none; transition: opacity 0.15s ease;
      }
      #prompt.on { opacity: 1; }
      #prompt kbd {
        display: inline-block; min-width: 20px; text-align: center; padding: 1px 6px;
        border: 1px solid rgba(255,255,255,0.45); border-bottom-width: 3px; border-radius: 5px;
        font: 700 13px monospace; color: #ffb070; background: rgba(255,255,255,0.08);
      }
      #gameScreen {
        position: fixed; inset: 0; z-index: 5; display: none; overflow: hidden;
        background: linear-gradient(#070a16 0%, #0d1226 55%, #151a2e 100%);
        color: #e8e6df; font: 14px system-ui, "Malgun Gothic", sans-serif;
      }
      #gameScreen.on { display: block; }
      #gameScreen .gsStage {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #gameScreen .gsCanvas { image-rendering: pixelated; image-rendering: crisp-edges; background: #07070c; }
      #gameScreen .gsTop { pointer-events: none; z-index: 2; position: absolute; left: 16px; top: 16px; display: flex; gap: 12px; align-items: center;
        padding: 8px 14px; border-radius: 10px; background: rgba(10,12,20,0.72); border: 1px solid rgba(255,255,255,0.12); }
      #gameScreen .gsLive { color: #ff5c5c; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; animation: gsBlink 1.6s infinite; }
      #gameScreen .gsTitle { font-weight: 700; color: #ffb070; font-size: 16px; }
      #gameScreen .gsSub { color: rgba(232,230,223,0.7); font-size: 12px; }
      #gameScreen .gsBottom { pointer-events: none; z-index: 2; position: absolute; left: 16px; bottom: 16px; display: flex; gap: 14px; align-items: center;
        padding: 8px 14px; border-radius: 10px; background: rgba(10,12,20,0.72); border: 1px solid rgba(255,255,255,0.12); font-size: 13px; }
      #gameScreen .gsStatus { color: rgba(232,230,223,0.7); }
      @keyframes gsBlink { 0%, 60% { opacity: 1; } 80% { opacity: 0.3; } 100% { opacity: 1; } }
      #gameScreen kbd {
        display: inline-block; min-width: 18px; text-align: center; padding: 0 5px; margin: 0 4px 0 8px;
        border: 1px solid rgba(255,255,255,0.3); border-bottom-width: 2px; border-radius: 4px;
        font: 12px monospace; color: #fff; background: rgba(255,255,255,0.06);
      }
      #notice { z-index: 12; position: fixed; left: 50%; top: 18%; transform: translateX(-50%); min-width: 360px; padding: 12px 28px; border-radius: 10px;
        background: rgba(10,12,20,0.82); border: 1px solid rgba(255,176,112,0.5); color: #ffe9c9;
        font: 600 15px/1.6 system-ui, "Malgun Gothic", sans-serif; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; white-space: pre-line; text-align: center; }
      #notice.on { opacity: 1; }
      #dayCard { z-index: 21; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
        color: #e8e6df; font: 700 42px system-ui, "Malgun Gothic", sans-serif; letter-spacing: 0.3em; opacity: 0; transition: opacity 0.4s ease; }
      #dayCard.on { opacity: 1; }
      /* 분기 선택창: 게임 UI 풍 — 제목 + 좌우 커다란 버튼 (마우스 클릭 또는 1/2 키) */
      #choice { z-index: 18; position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.5); color: #e8e6df; font: 15px/1.6 system-ui, "Malgun Gothic", sans-serif; }
      #choice.on { display: flex; }
      #choice.low { justify-content: flex-end; padding-bottom: 9vh; }
      #choice .q { font-size: 22px; font-weight: 800; letter-spacing: 0.08em; color: #f3ede0; text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin-bottom: 20px;
        padding: 8px 26px; border-top: 1px solid rgba(255,255,255,0.35); border-bottom: 1px solid rgba(255,255,255,0.35); }
      #choice .btns { display: flex; gap: 26px; width: min(880px, 92vw); }
      #choice .btn { flex: 1; position: relative; padding: 26px 22px 22px; border-radius: 16px; cursor: pointer; text-align: center; user-select: none;
        background: linear-gradient(180deg, rgba(30,34,48,0.96), rgba(12,14,22,0.96)); border: 2px solid rgba(255,255,255,0.22);
        box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.15); transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s; }
      #choice .btn:hover, #choice .btn.hot { transform: translateY(-4px) scale(1.02); }
      #choice .btn.break { border-color: rgba(190,220,255,0.55); }
      #choice .btn.break:hover, #choice .btn.break.hot { border-color: #dbeeff; box-shadow: 0 0 34px rgba(160,200,255,0.55), 0 12px 30px rgba(0,0,0,0.6); }
      #choice .btn.keep { border-color: rgba(255,90,90,0.55); background: linear-gradient(180deg, rgba(58,12,16,0.96), rgba(18,5,7,0.96)); }
      #choice .btn.keep:hover, #choice .btn.keep.hot { border-color: #ff6a6a; box-shadow: 0 0 34px rgba(255,60,60,0.55), 0 12px 30px rgba(0,0,0,0.6); }
      #choice .btn .ttl { font-size: 24px; font-weight: 800; letter-spacing: 0.06em; }
      #choice .btn.break .ttl { color: #dbeeff; }
      #choice .btn.keep .ttl { color: #ff8a8a; }
      #choice .btn .sub { margin-top: 6px; font-size: 14px; opacity: 0.75; }
      #choice .btn kbd { position: absolute; left: 14px; top: 12px; display: inline-block; min-width: 22px; padding: 2px 8px; border: 1px solid rgba(255,255,255,0.4);
        border-bottom-width: 3px; border-radius: 6px; font: 700 13px monospace; color: #ffb070; background: rgba(255,255,255,0.08); }
      #choice .btn:active { transform: translateY(1px) scale(0.99); }
      /* 화면 지직거림: 가로 줄무늬 + 색 어긋남이 빠르게 흔들림 */
      #glitch { z-index: 16; position: fixed; inset: 0; pointer-events: none; opacity: 0;
        background:
          repeating-linear-gradient(0deg, rgba(255,255,255,0.08) 0 2px, rgba(0,0,0,0.35) 2px 4px),
          repeating-linear-gradient(90deg, rgba(255,0,60,0.25) 0 3px, transparent 3px 11px, rgba(0,200,255,0.2) 11px 13px, transparent 13px 37px);
        mix-blend-mode: hard-light; }
      #glitch.on { animation: glitchFx 1.2s steps(12) forwards; }
      @keyframes glitchFx {
        0% { opacity: 1; transform: translate(0, 0); background-position: 0 0, 0 0; }
        20% { opacity: 0.9; transform: translate(-14px, 3px) skewX(2deg); background-position: 0 40px, 120px 0; }
        40% { opacity: 1; transform: translate(10px, -6px); background-position: 0 -30px, -80px 0; }
        60% { opacity: 0.7; transform: translate(-6px, 8px) skewX(-3deg); background-position: 0 90px, 40px 0; }
        80% { opacity: 1; transform: translate(4px, -2px); background-position: 0 -70px, -160px 0; }
        100% { opacity: 0; transform: translate(0, 0); }
      }
      /* 시뻘건 시스템 경고창 (점프스케어): 확 튀어나오며 떨림 */
      #sysWarn { z-index: 19; position: fixed; left: 50%; top: 36%; transform: translate(-50%, -50%) scale(0); width: min(560px, 86vw);
        border: 4px solid #ff1a1a; background: rgba(46, 0, 0, 0.96); color: #ff4d4d; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
        box-shadow: 0 0 40px rgba(255, 20, 20, 0.85), inset 0 0 30px rgba(255, 0, 0, 0.35); opacity: 0; pointer-events: none; }
      #sysWarn.on { animation: sysPop 0.35s cubic-bezier(0.2, 1.6, 0.4, 1) forwards, sysShake 0.12s steps(2) 0.35s infinite; }
      #sysWarn.dock { animation: none; opacity: 1; transform: translate(-50%, -50%) scale(0.72); top: 22%; transition: transform 0.4s, top 0.4s; }
      #sysWarn .sysBar { padding: 6px 12px; background: #b00000; color: #fff; font-weight: 800; letter-spacing: 0.25em; font-size: 14px; }
      #sysWarn .sysBody { padding: 30px 26px 34px; font-size: 28px; font-weight: 800; line-height: 1.45; text-align: center;
        text-shadow: 0 0 12px #ff2020, 2px 0 #ff9090, -2px 0 #900; }
      @keyframes sysPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.2) rotate(-4deg); } 60% { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(1.5deg); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
      @keyframes sysShake { 0% { margin-left: -4px; margin-top: 2px; } 50% { margin-left: 4px; margin-top: -3px; } 100% { margin-left: -2px; margin-top: 1px; } }
      /* 타이틀 전 고지 화면: 검은 배경에 문구가 천천히 떠올랐다 사라진다 */
      #disclaimer { z-index: 40; position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; padding: 0 24px; text-align: center;
        color: #c9c6bd; font: 15px/2 system-ui, "Malgun Gothic", sans-serif; letter-spacing: 0.06em; transition: opacity 1.2s ease; }
      #disclaimer .txt { max-width: 620px; opacity: 0; transition: opacity 1.4s ease; }
      #disclaimer.on .txt { opacity: 1; }
      #disclaimer.out { opacity: 0; pointer-events: none; }
      /* 엔딩 크레딧: 배경 위로 글줄이 아래에서 위로 올라오고(JS Web Animations), 마지막 "R · 처음부터"가 가운데 멈춘다 */
      #ending { z-index: 30; position: fixed; inset: 0; display: none; overflow: hidden; text-align: center;
        color: #e8e6df; font: 16px/1.9 system-ui, "Malgun Gothic", sans-serif; opacity: 0; transition: opacity 1.6s ease; }
      #ending.on { display: block; opacity: 1; }
      #ending.true { background: radial-gradient(ellipse at center, #f7f2e6 0%, #d9d2c2 100%); color: #3a2f28; }
      #ending.bad { background: radial-gradient(ellipse at center, #2a0508 0%, #050203 100%); color: #ffb3b3; }
      /* 엔딩 3 (내일도 오늘도 같은 하루): 검은 화면 */
      #ending.same { background: #000; color: #9a9a9a; }
      #ending.same .credits .last { color: #d8d8d8; letter-spacing: 0.3em; }
      /* 엔딩 4 (게임 오버): 2일차 숲의 괴물에게 잡힘. 버튼(또는 R/Enter)으로 그날 처음부터 */
      #gameOver { z-index: 30; position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at center, rgba(70,0,8,0.96) 0%, rgba(0,0,0,0.98) 100%); color: #ff5c5c; font: 15px/1.6 system-ui, "Malgun Gothic", sans-serif; }
      #gameOver.on { display: flex; }
      #gameOver .go { font-size: 56px; font-weight: 900; letter-spacing: 0.2em; text-shadow: 0 0 24px rgba(255,40,40,0.8); }
      #gameOver .sub { color: rgba(255,179,179,0.75); letter-spacing: 0.2em; font-size: 13px; }
      #gameOver .btn { margin-top: 12px; padding: 12px 34px; border-radius: 12px; cursor: pointer; user-select: none; color: #ffe9c9; font-weight: 700; font-size: 17px;
        background: rgba(20,4,6,0.9); border: 2px solid rgba(255,92,92,0.6); box-shadow: 0 8px 26px rgba(0,0,0,0.6); }
      #gameOver .btn:hover { border-color: #ff8a8a; box-shadow: 0 0 26px rgba(255,60,60,0.5); }
      #gameOver .btn kbd { margin-right: 8px; padding: 1px 7px; border: 1px solid rgba(255,255,255,0.4); border-bottom-width: 3px; border-radius: 5px; font: 700 12px monospace; color: #ffb070; }
      /* 6자리 비밀번호 다이얼 (숲의 동상 / 고성 문 공용) */
      #dial { z-index: 24; position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); }
      #dial.on { display: flex; }
      #dial .box { padding: 18px 26px 16px; border-radius: 14px; background: rgba(10,12,20,0.95); border: 2px solid rgba(255,176,112,0.55);
        color: #e8e6df; font: 14px/1.6 system-ui, "Malgun Gothic", sans-serif; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.7); }
      #dial .title { font-weight: 700; color: #ffb070; font-size: 16px; margin-bottom: 12px; letter-spacing: 0.04em; }
      #dial .digits { display: flex; gap: 8px; justify-content: center; }
      #dial .cell { width: 44px; padding: 4px 0; border-radius: 8px; cursor: pointer; user-select: none; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); }
      #dial .cell.cur { border-color: #ffb070; background: rgba(255,176,112,0.16); box-shadow: 0 0 14px rgba(255,176,112,0.35); }
      #dial .cell .num { font: 700 30px monospace; color: #fff; line-height: 1.2; }
      #dial .cell .arrow { font-size: 10px; color: rgba(255,255,255,0.35); line-height: 1; }
      #dial .cell.cur .arrow { color: #ffb070; }
      #dial .hint { margin-top: 12px; font-size: 12px; color: rgba(232,230,223,0.6); }
      #dial kbd, #confirm kbd { display: inline-block; min-width: 14px; padding: 0 5px; margin: 0 2px; border: 1px solid rgba(255,255,255,0.35); border-bottom-width: 2px; border-radius: 4px;
        font: 700 11px monospace; color: #ffb070; background: rgba(255,255,255,0.06); }
      /* 시스템 메시지 선택창 ("관찰하시겠습니까?") */
      /* 화면 가운데를 가리지 않도록 아래쪽에 띄운다 */
      #confirm { z-index: 24; position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; padding-bottom: 10vh; background: rgba(0,0,0,0.25); }
      #confirm.on { display: flex; }
      #confirm .box { min-width: 320px; border-radius: 10px; overflow: hidden; background: rgba(10,12,20,0.96); border: 2px solid rgba(159,179,200,0.5);
        color: #e8e6df; font: 15px/1.6 system-ui, "Malgun Gothic", sans-serif; box-shadow: 0 12px 40px rgba(0,0,0,0.7); }
      #confirm .bar { padding: 5px 12px; background: rgba(159,179,200,0.18); color: #9fb3c8; font: 700 11px monospace; letter-spacing: 0.25em; }
      #confirm .msg { padding: 18px 22px 8px; text-align: center; font-weight: 600; white-space: pre-line; line-height: 1.7; }
      #confirm .opts { display: flex; gap: 10px; justify-content: center; padding: 8px 18px 18px; }
      #confirm .opt { flex: 1; padding: 9px 14px; border-radius: 8px; cursor: pointer; user-select: none; text-align: center;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14); transition: border-color 0.12s, background 0.12s; }
      #confirm .opt.cur { border-color: #ffb070; background: rgba(255,176,112,0.16); color: #ffe9c9; }
      #ending .credits { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
      #ending .credits .blk { margin: 0 auto 64px; max-width: 640px; }
      #ending .credits .ttl { font-size: 44px; font-weight: 800; letter-spacing: 0.3em; margin-bottom: 8px; }
      #ending .credits .endName { font-size: 26px; font-weight: 700; letter-spacing: 0.25em; opacity: 0.9; }
      #ending .credits .role { font-size: 12px; letter-spacing: 0.3em; opacity: 0.6; margin-bottom: 4px; }
      #ending .credits .who { font-size: 19px; font-weight: 600; }
      #ending .credits .last { font-size: 22px; font-weight: 700; letter-spacing: 0.1em; }
      #ending.bad .credits .last { color: #ff3b3b; text-shadow: 0 0 18px rgba(255,40,40,0.8); }
      #ending .credits .copyright { font-size: 12px; opacity: 0.55; letter-spacing: 0.04em; margin-bottom: 14px; }
      #ending .credits .endHint { font-size: 13px; opacity: 0.7; }
      /* 배드엔딩 점프스케어: 화면 전체를 덮는 "쾅!" / "보내줘!" */
      #bang { z-index: 29; position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(90,0,6,0.92) 0%, rgba(0,0,0,0.97) 100%);
        color: #ff2a2a; font: 900 min(28vw, 240px)/1 "Malgun Gothic", system-ui, sans-serif; letter-spacing: 0.04em;
        text-shadow: 0 0 40px rgba(255,20,20,0.9), 6px 0 #ff9090, -6px 0 #700; }
      #bang.on { display: flex; animation: bangPop 0.18s cubic-bezier(0.2, 1.8, 0.4, 1) forwards, bangShake 0.09s steps(2) 0.18s infinite; }
      @keyframes bangPop { 0% { transform: scale(0.3) rotate(-6deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
      @keyframes bangShake { 0% { transform: translate(-10px, 6px) rotate(-1deg); } 50% { transform: translate(12px, -8px) rotate(1.2deg); } 100% { transform: translate(-4px, 3px); } }
      /* 배드엔딩 채팅 도배: 붉은 글씨 */
      #chatLog .chatMsg.chatRed, #chatLog .chatMsg.chatRed b { color: #ff3b3b; font-weight: 800; text-shadow: 0 0 6px rgba(255,40,40,0.6); }
      body.ingame #prompt { display: none; }
      /* 게임 중: 채팅을 화면 맨 위 오른쪽에 낮게(13vh) 붙이고 스크롤바 없이 최신 메시지만 보이게. 위쪽 알약(모드/날짜)은 채팅 왼쪽으로 비켜 준다 */
      body.ingame #chatLog { bottom: auto; top: 12px; max-height: 13vh; overflow-y: hidden; background: rgba(10,12,20,0.55); }
      body.ingame #mode, body.ingame #day { right: 352px; }
      #settingsBtn { z-index: 11; position: fixed; right: 16px; top: 16px; width: 34px; height: 34px; border-radius: 999px; cursor: pointer;
        color: #e8e6df; font-size: 18px; line-height: 1; background: rgba(10,12,20,0.6); border: 1px solid rgba(255,255,255,0.14); }
      #settingsBtn:hover { border-color: rgba(255,176,112,0.6); color: #ffb070; }
      #settings { z-index: 25; position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.45); }
      #settings.on { display: flex; }
      #settings .box { width: 380px; padding: 18px 22px; border-radius: 12px; background: rgba(10,12,20,0.94); border: 1px solid rgba(255,176,112,0.5);
        color: #e8e6df; font: 14px/1.6 system-ui, "Malgun Gothic", sans-serif; }
      #settings .title { display: flex; justify-content: space-between; font-weight: 700; color: #ffb070; font-size: 16px; margin-bottom: 10px; }
      #settings .close { cursor: pointer; color: rgba(232,230,223,0.7); }
      #settings .row { display: grid; grid-template-columns: 76px 1fr 32px; gap: 10px; align-items: center; margin: 8px 0; }
      #settings input[type=range] { width: 100%; accent-color: #ffb070; }
      #settings input[type=checkbox] { justify-self: start; accent-color: #ffb070; width: 16px; height: 16px; }
      #settings .val { text-align: right; font: 12px monospace; color: rgba(232,230,223,0.8); }
      #settings .hint { margin-top: 12px; font-size: 11px; color: rgba(232,230,223,0.55); }
      /* 설정창 아래쪽 단축키 안내 */
      #settings .keys { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 12px; }
      #settings .keysTitle { font-weight: 700; color: #ffb070; margin-bottom: 6px; font-size: 13px; }
      #settings .keyRow { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; color: rgba(232,230,223,0.85); }
      #settings .keyRow span:last-child { text-align: right; color: rgba(232,230,223,0.7); }
      #settings kbd { display: inline-block; min-width: 14px; text-align: center; padding: 0 5px; margin: 0 1px; border: 1px solid rgba(255,255,255,0.35); border-bottom-width: 2px; border-radius: 4px;
        font: 700 11px monospace; color: #ffb070; background: rgba(255,255,255,0.06); }
      body.ingame #settingsBtn { display: none; }
      /* 나침반 (숲): 왼쪽 위. 위쪽 바늘이 보는 방향, 글자판이 돈다 */
      #compass { z-index: 10; position: fixed; left: 16px; top: 16px; width: 86px; height: 86px; border-radius: 50%; display: none;
        background: radial-gradient(circle at center, rgba(20,22,32,0.85) 0%, rgba(10,12,20,0.75) 100%); border: 2px solid rgba(255,176,112,0.45);
        box-shadow: 0 4px 16px rgba(0,0,0,0.5); font: 700 13px system-ui, sans-serif; color: rgba(232,230,223,0.8); }
      #compass.on { display: block; }
      #compass .needle { position: absolute; left: 50%; top: 4px; width: 0; height: 0; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 12px solid #ffb070; }
      #compass .rose { position: absolute; inset: 0; transition: transform 0.15s linear; }
      #compass .rose span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
      #compass .rose .n { color: #ff6a5a; font-size: 15px; transform: translate(-50%, -50%) translateY(-27px); }
      #compass .rose .s { transform: translate(-50%, -50%) translateY(27px); }
      #compass .rose .e { transform: translate(-50%, -50%) translateX(27px); }
      #compass .rose .w { transform: translate(-50%, -50%) translateX(-27px); }
      #compass::after { content: ''; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: #ffb070; transform: translate(-50%, -50%); }
      /* 시작 화면: 방 장면 위의 반투명 레이어 + 커다란 타이틀 + 메뉴 */
      #title { z-index: 26; position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 8vh; gap: 0;
        background: rgba(6, 7, 14, 0.62); backdrop-filter: blur(3px); color: #e8e6df; font: 16px/1.6 system-ui, "Malgun Gothic", sans-serif; }
      #title.on { display: flex; }
      #title .ttl { font-size: clamp(64px, 12vw, 150px); font-weight: 900; letter-spacing: 0.18em; padding-left: 0.18em; color: #ffe9c9; line-height: 1.1;
        text-shadow: 0 6px 30px rgba(0,0,0,0.85), 0 0 60px rgba(255,176,112,0.35); }
      #title .ttl .small { font-size: 0.5em; letter-spacing: 0.1em; vertical-align: 0.12em; opacity: 0.9; }
      #title .menu { display: flex; flex-direction: column; gap: 12px; width: min(360px, 80vw); margin-top: 22vh; }
      #title .hint { margin-top: 26px; }
      #title .item { display: flex; align-items: center; gap: 14px; padding: 14px 22px; border-radius: 12px; cursor: pointer; user-select: none; font-size: 22px; font-weight: 700;
        background: rgba(10,12,20,0.7); border: 2px solid rgba(255,255,255,0.16); transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s; }
      #title .item.cur { border-color: #ffb070; color: #ffe9c9; transform: translateX(6px); box-shadow: 0 0 26px rgba(255,176,112,0.35); }
      #title .item.off { opacity: 0.35; cursor: default; }
      #title .item kbd { display: inline-block; min-width: 20px; text-align: center; padding: 1px 7px; border: 1px solid rgba(255,255,255,0.4); border-bottom-width: 3px; border-radius: 6px;
        font: 700 13px monospace; color: #ffb070; background: rgba(255,255,255,0.08); }
      #title .hint { font-size: 13px; color: rgba(232,230,223,0.6); }
      #title .hint kbd { padding: 0 5px; border: 1px solid rgba(255,255,255,0.35); border-bottom-width: 2px; border-radius: 4px; font: 700 11px monospace; color: #ffb070; }
      #fade { position: fixed; inset: 0; z-index: 20; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.35s ease; }
      #fade.on { opacity: 1; }
      #fadeWhite { position: fixed; inset: 0; z-index: 20; background: #fff; opacity: 0; pointer-events: none; transition: opacity 1.2s ease; }
      #fadeWhite.on { opacity: 1; }
      #chatLog {
        z-index: 10;
        position: fixed; right: 16px; bottom: 16px; width: 300px; max-height: 42vh;
        overflow-y: auto; padding: 10px 12px; border-radius: 10px;
        background: rgba(10, 12, 20, 0.72); border: 1px solid rgba(255,255,255,0.12);
        color: #e8e6df; font: 12px/1.5 system-ui, "Malgun Gothic", sans-serif;
        opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
      }
      #chatLog.on { opacity: 1; }
      #chatLog .chatMsg { padding: 2px 0; }
      #chatLog .chatMsg b { color: #ffb070; margin-right: 4px; }
      #chatLog .chatBadge { margin-right: 4px; vertical-align: -3px; }
      #chatLog .chatEvent {
        background: rgba(255,176,112,0.18); border-radius: 6px;
        padding: 4px 6px; margin: 3px 0; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="mode">HOME</div>
    <div id="day">DAY 1</div>
    <div id="scareFlash"></div>
    <div id="dayCard">DAY 2</div>
    <div id="glitch"></div>
    <div id="sysWarn"><div class="sysBar">⚠ SYSTEM</div><div class="sysBody">그걸 부수면 넌 혼자가 될거야.<br>부수지마.</div></div>
    <div id="choice">
      <div class="q">석상을 어떻게 할까?</div>
      <div class="btns">
        <div class="btn break" data-choice="release"><kbd>1</kbd><div class="ttl">부순다</div><div class="sub">파닥이들을 돌려보낸다 — 나는 혼자가 된다</div></div>
        <div class="btn keep" data-choice="keep"><kbd>2</kbd><div class="ttl">부수지 않는다</div><div class="sub">파닥이들과 함께 남는다</div></div>
      </div>
    </div>
    <div id="bang"></div>
    <div id="gameOver"><div class="go">GAME OVER</div><div class="sub">엔딩 4</div><div class="btn"><kbd>R</kbd>다시 시작</div></div>
    <div id="ending"><div class="credits"></div></div>
    <div id="fade"></div>
    <div id="fadeWhite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
